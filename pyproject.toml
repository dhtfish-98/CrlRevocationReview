[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "cvp-crl-revocation-review"
version = "0.1.1"
description = "Direct-issuer full CRL signature and freshness verification for one pinned issuer and one explicitly supplied target certificate."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "UPSTREAM_LICENSE"]
readme = "README.md"
dependencies = ["cryptography==50.0.2", "PyNaCl==1.6.2"]
[project.scripts]
crl-revocation-review = "crl_revocation_review.cli:entry"
[tool.setuptools.packages.find]
where = ["src"]
